<!DOCTYPE html>
<html>
   <head>
      <title>ONT & MAC Report Dashboard</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   </head>
   <body class="bg-light">
      <div class="container mt-4">
         <div class="text-center mb-4">
            <h2>ONT Optic and MAC Address Data Report Dashboard</h2>
            <img src="/static/images/Company.png" height="60">
            <img src="/static/images/Customer.png" height="60">
         </div>
         <h4>ONT Data Reports</h4>
         <table class="table table-striped">
            <tr>
               <th>Report Name</th>
               <th class="text-end">Download</th>
            </tr>
            {% for file in ont_reports %}
            <tr>
               <td>{{ file }}</td>
               <td class="text-end">
                  <a href="/download/{{ file }}" class="btn btn-primary btn-sm">
                  Download
                  </a>
               </td>
            </tr>
            {% endfor %}
         </table>
         <h4>MAC Address Reports</h4>
         <table class="table table-striped">
            <tr>
               <th>Report Name</th>
               <th class="text-end">Download</th>
            </tr>
            {% for file in mac_reports %}
            <tr>
               <td>{{ file }}</td>
               <td class="text-end">
                  <a href="/download/{{ file }}" class="btn btn-primary btn-sm">
                  Download
                  </a>
               </td>
            </tr>
            {% endfor %}
         </table>
      </div>
      <footer class="text-center mt-5 mb-3">
         <small style="color:red; font-weight:bold;">
         Commercial in Confidence
         </small>
      </footer>
   </body>
</html>
